publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.2
  encrypt: ^5.0.3
  crypto: ^3.0.3
  http: ^1.2.0
  dio: ^5.4.3
  uuid: ^4.3.3
  tflite_flutter: ^0.10.4
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/models/bge-micro-v2.tflite
