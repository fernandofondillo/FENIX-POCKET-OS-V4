name: fenix_pocket_os
description: Fénix Pocket OS V4 (A.G.O.S.) - Functional mobile agent
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Soberanía at-rest y criptología Zero-Knowledge
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Persistencia y file system
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Red
  http: ^1.2.0
  dio: ^5.4.3

  # Identidad
  uuid: ^4.3.3

  # Logging
  logger: ^2.0.2

  # UI y utils
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
