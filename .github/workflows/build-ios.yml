name: Build Fenix iOS (Sideloadly-ready, no-codesign)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter 3.44.1 stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable

      - name: Verify Xcode (default selected by runner)
        run: xcodebuild -version

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ios/Pods
            ios/.symlinks
            build/ios
          key: ios-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ios-pub-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: Build iOS framework (no codesign, archive)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=4.1.0 \
            --build-number=41
        env:
          JAVA_HOME: /opt/homebrew/opt/openjdk@17

      - name: Verify Runner.app exists
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app NOT found at $APP_PATH"
            ls -la build/ios/ 2>&1 || true
            exit 1
          fi
          echo "✅ Runner.app exists:"
          ls -la "$APP_PATH"
          echo "---"
          file "$APP_PATH/Runner"

      - name: Package .app into .ipa (no signing)
        run: |
          # Estructura iOS correcta: Payload/Runner.app/...
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          # IPA = zip DESDE EL DIRECTORIO PADRE para que los paths incluyan "Payload/"
          zip -r fenix-pocket-os-unsigned.ipa Payload
          ls -lah fenix-pocket-os-unsigned.ipa
          echo "--- Verificar estructura ---"
          unzip -l fenix-pocket-os-unsigned.ipa | head -10
          echo "✅ IPA con estructura iOS estándar (Sideloadly-ready)"

      - name: Upload .ipa artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: fenix-pocket-os-ios-unsigned
          path: fenix-pocket-os-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
